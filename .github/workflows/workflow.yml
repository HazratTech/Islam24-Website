name: Build and Deploy Islam24 website

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name : Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{secrets.DOCKERHUB_USERNAME}}/islam24-website:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

  deploy :
    runs-on: self-hosted
    needs: build

    steps:
      - name: Pull and restart Container
        run: |
          docker pull ${{secrets.DOCKERHUB_USERNAME}}/islam24-website:latest
          
          docker stop islam24-website || true
          docker rm islam24-website || true
          
          docker run -d \
            --name islam24-website \
            --network custom_bridge \
            --ip 172.25.0.10 \
            --env-file /home/envs/islam24-website.env \
            -p 8082:8082 \
            --restart unless-stopped \
            ${{secrets.DOCKERHUB_USERNAME}}/islam24-website:latest

          sleep 5
          docker ps | grep islam24-website
